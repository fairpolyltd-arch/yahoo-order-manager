services:
  - type: web
    name: yahoo-order-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_backend.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: order-data
      mountPath: /app/backend/data
      sizeGB: 1
